name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 1.0.1)"
                required: true
                type: string

permissions:
    contents: write
    packages: write

jobs:
    publish:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Test
              run: dotnet test --no-build --configuration Release

            - name: Pack
              id: pack
              run: |
                  $tagVersion = "${{ github.event.release.tag_name }}"
                  $inputVersion = "${{ github.event.inputs.version }}"
                  if ($inputVersion) {
                      $version = $inputVersion.TrimStart('v')
                  } else {
                      $version = $tagVersion.TrimStart('v')
                  }
                  echo "VERSION=$version" >> $env:GITHUB_ENV
                  dotnet pack --no-build --configuration Release --output ./artifacts -p:PackageVersion=$version

            - name: Push to NuGet
              run: |
                  Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
                      dotnet nuget push $_.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
                  }

            - name: Push to GitHub Packages
              run: |
                  Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
                      dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
                  }

            - name: Upload packages to GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.version) }}
                  files: |
                      ./artifacts/*.nupkg
                      ./artifacts/*.snupkg

            - name: Update release description
              if: (github.event_name == 'release' && github.event.release.body == '') || github.event_name == 'workflow_dispatch'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.version) }}
                  body: |
                      ## 📦 Sharingan ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.version) }}

                      **Cross-Platform Local Settings Library for .NET**

                      A robust, multi-process-safe, async-first settings library for managing application, user, and device settings locally.

                      ---

                      ### 📥 Installation

                      ```bash
                      dotnet add package Sharingan --version ${{ env.VERSION }}
                      ```

                      ---

                      ### 📋 Packages

                      | Package | Description |
                      |---------|-------------|
                      | `Sharingan` | Core library with JSON, InMemory, Environment, and Composite providers |
                      | `Sharingan.Abstractions` | Core interfaces and abstractions |
                      | `Sharingan.Providers.Registry` | Windows Registry provider |
                      | `Sharingan.Providers.Ini` | INI file provider |
                      | `Sharingan.Providers.Yaml` | YAML file provider |
                      | `Sharingan.Providers.Xml` | XML file provider |
                      | `Sharingan.Providers.Toml` | TOML file provider |
                      | `Sharingan.Providers.SQLite` | SQLite database provider |
                      | `Sharingan.Providers.Encrypted` | Encryption wrapper provider |
                      | `Sharingan.Extensions.DependencyInjection` | Microsoft DI integration |
                      | `Sharingan.Extensions.Configuration` | Microsoft.Extensions.Configuration bridge |

                      ---

                      ### 🎯 Supported Frameworks

                      | Framework | Support |
                      |-----------|---------|
                      | .NET Framework 4.8 | ✅ |
                      | .NET Framework 4.8.1 | ✅ |
                      | .NET Standard 2.0 | ✅ |
                      | .NET Standard 2.1 | ✅ |
                      | .NET 7.0 | ✅ |
                      | .NET 8.0 | ✅ |
                      | .NET 9.0 | ✅ |
                      | .NET 10.0 | ✅ |

                      ---

                      ### 🌐 Supported Platforms

                      | Platform | Support |
                      |----------|---------|
                      | Windows | ✅ |
                      | Linux | ✅ |
                      | macOS | ✅ |
                      | Android | ✅ |
                      | iOS | ✅ |

                      ---

                      ### 🔗 Links

                      - [📦 NuGet](https://www.nuget.org/packages/Sharingan)
                      - [📝 Changelog](https://github.com/${{ github.repository }}/blob/develop/CHANGELOG.md)
                      - [📖 Documentation](https://github.com/${{ github.repository }})
